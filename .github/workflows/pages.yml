name: Publish Miracle Book website
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: github-pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out website
        uses: actions/checkout@v6
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Assemble static website
        run: |
          mkdir -p _site
          cp index.html styles.css app.js platform.js core.mjs privacy.html manifest.json icon-192.png icon-512.png README.md _site/
          unzip -q site-assets.zip -d _site
          unzip -q background-music.zip -d _site
          touch _site/.nojekyll
          test -s _site/data/quotes.json
          test -s _site/assets/fonts/moe-li.ttf
          test -s _site/assets/music/shanshui.mp3
      - name: Upload website
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site
  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish website
        id: deployment
        uses: actions/deploy-pages@v4
